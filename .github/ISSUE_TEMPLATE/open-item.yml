name: Production work item
description: Implement or verify one traced production item
title: "[ITEM-ID] "
labels: ["status:open"]
body:
  - type: input
    id: item
    attributes:
      label: Work item ID
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
  - type: input
    id: requirements
    attributes:
      label: Requirement IDs
  - type: input
    id: source
    attributes:
      label: Source repository commits
  - type: textarea
    id: tests
    attributes:
      label: Required tests and evidence
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Security, data and rollback considerations
    validations:
      required: true
