name: CodeQL

# Static security analysis of the TypeScript in backend/, frontend/ and
# mobile/, and of the workflows themselves. The public repository uploads
# findings to GitHub code scanning and also retains SARIF for 30 days.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published query catches code that has not changed.
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # TypeScript needs no build step for CodeQL.
          build-mode: none
          # The default suite plus the extended security queries.
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/dist/**'
              - '**/coverage/**'
              - '**/*.spec.ts'
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - 'backend/test/**'
              - 'frontend/e2e/**'

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
          output: results
          upload: always

      - name: Retain SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: results
          if-no-files-found: error
          retention-days: 30
