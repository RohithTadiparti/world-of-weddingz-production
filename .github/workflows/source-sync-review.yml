name: Source synchronization review

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: source-synchronization-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production governance
        uses: actions/checkout@v4

      - name: Require private source access
        env:
          WOW_SYNC_TOKEN: ${{ secrets.WOW_SYNC_TOKEN }}
        run: |
          if [ -z "$WOW_SYNC_TOKEN" ]; then
            echo "WOW_SYNC_TOKEN is required: fine-grained access to RohithTadiparti/WOW-MD with Contents: read."
            exit 1
          fi

      - name: Check out private WOW-MD source
        uses: actions/checkout@v4
        with:
          repository: RohithTadiparti/WOW-MD
          ref: main
          path: .source
          fetch-depth: 0
          token: ${{ secrets.WOW_SYNC_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate review evidence
        shell: bash
        run: |
          baseline="$(node -p "require('./.production/source-baseline.json').reviewedCommit")"
          node scripts/source-sync/report.mjs \
            --source .source \
            --baseline "$baseline" \
            --output outputs/source-sync
          cat outputs/source-sync/source-sync-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload 30-day review artifact
        uses: actions/upload-artifact@v4
        with:
          name: wow-source-sync-report
          path: outputs/source-sync/
          retention-days: 30

      - name: Update the SYNC-002 issue comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- wow-source-sync-report -->';
            const body = fs.readFileSync('outputs/source-sync/source-sync-report.md', 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 32,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 32,
                body,
              });
            }
