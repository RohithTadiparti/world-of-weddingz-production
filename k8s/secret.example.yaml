# EXAMPLE ONLY, do not commit real secrets. In production these come from
# AWS Secrets Manager via External Secrets Operator or CSI driver, not a
# hand-written manifest. Values below are placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: wow-backend-secrets
  namespace: wow
type: Opaque
stringData:
  DB_HOST: "wow-db.xxxx.ap-south-1.rds.amazonaws.com"
  DB_USER: "wow_user"
  DB_PASSWORD: "REPLACE_ME"
  REDIS_HOST: "wow-redis.xxxx.ng.0001.aps1.cache.amazonaws.com"
  REDIS_PASSWORD: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME_min_32_chars_xxxxxxxxxxxxxx"
  JWT_REFRESH_SECRET: "REPLACE_ME_min_32_chars_yyyyyyyyyyyyyy"
  ZOHO_CLIENT_ID: "REPLACE_WITH_SERVER_APP_CLIENT_ID"
  ZOHO_CLIENT_SECRET: "REPLACE_WITH_SERVER_APP_CLIENT_SECRET"
  SMTP_USER: "no-reply@your-domain.com"
  SMTP_PASSWORD: "REPLACE_WITH_ZOHO_APP_PASSWORD"
  # Consumed only by the wow-seed-admin Job, never by the running API.
  ADMIN_EMAIL: "admin@your-domain.com"
  ADMIN_PASSWORD: "REPLACE_ME_min_12_chars"
  RAZORPAY_KEY_ID: "REPLACE_ME"
  RAZORPAY_KEY_SECRET: "REPLACE_ME"
  PAYMENT_WEBHOOK_SECRET: "REPLACE_ME"
  AADHAAR_CLIENT_ID: "REPLACE_WHEN_REVENUE_TIER_REQUIRES_LICENSED_IDENTITY"
  AADHAAR_CLIENT_SECRET: "REPLACE_WHEN_REVENUE_TIER_REQUIRES_LICENSED_IDENTITY"
