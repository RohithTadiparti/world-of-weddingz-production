server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Test builds of the Android app, mounted from docker/downloads (see the
  # compose file). No SPA fallback: a missing file is a 404, not the home page
  # served as "wow.apk". Never cached, so a rebuilt APK is the one people get.
  # version.json (and the optional ios.json) describe the build for the /app
  # page, so they are read, not downloaded.
  location /downloads/ {
    try_files $uri =404;
    types {
      application/vnd.android.package-archive apk;
      application/json json;
    }
    add_header Cache-Control "no-store";

    location ~ \.apk$ {
      add_header Content-Disposition "attachment";
      add_header Cache-Control "no-store";
    }
  }

  # Uploads go through this proxy, and nginx defaults to refusing anything over
  # 1MB with a 413. Every photograph from a phone made this decade is larger
  # than that, so the uploader's 10MB limit was academic — nginx said no first,
  # and the browser reported "that photo could not be uploaded" with no clue
  # why. Kept a little above MAX_FILE_SIZE on the API, so the API is the thing
  # that refuses an oversized file and can say so in words.
  client_max_body_size 12m;

  # Proxy API + websocket to the backend service.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # $http_host, not $host: $host drops the port, and the API builds upload
    # URLs for local storage from the address the device reached. Without the
    # port, a phone on the Wi-Fi was sent to 192.168.x.x:80, where nothing runs.
    proxy_set_header Host $http_host;
  }
  location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
