map $http_x_request_id $wow_request_id {
  "~^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" $http_x_request_id;
  default $request_id;
}

log_format wow_json escape=json '{'
  '"timestamp":"$time_iso8601",'
  '"level":"info",'
  '"service":"frontend",'
  '"requestId":"$wow_request_id",'
  '"method":"$request_method",'
  '"route":"$uri",'
  '"statusCode":$status,'
  '"bytes":$body_bytes_sent,'
  '"durationMs":$request_time,'
  '"upstreamStatus":"$upstream_status",'
  '"upstreamDuration":"$upstream_response_time"'
'}';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /dev/stdout wow_json;

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Test builds of the Android app, mounted from docker/downloads (see the
  # compose file). No SPA fallback: a missing file is a 404, not the home page
  # served as "wow.apk". Never cached, so a rebuilt APK is the one people get.
  # version.json (and the optional ios.json) describe the build for the /app
  # page, so they are read, not downloaded.
  location /downloads/ {
    try_files $uri =404;
    types {
      application/vnd.android.package-archive apk;
      application/json json;
    }
    add_header Cache-Control "no-store";

    location ~ \.apk$ {
      add_header Content-Disposition "attachment";
      add_header Cache-Control "no-store";
    }
  }

  # Uploads go through this proxy, and nginx defaults to refusing anything over
  # 1MB with a 413. Every photograph from a phone made this decade is larger
  # than that, so the uploader's 10MB limit was academic — nginx said no first,
  # and the browser reported "that photo could not be uploaded" with no clue
  # why. Kept a little above MAX_FILE_SIZE on the API, so the API is the thing
  # that refuses an oversized file and can say so in words.
  client_max_body_size 12m;

  # Proxy API + websocket to the backend service.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # $http_host, not $host: $host drops the port, and the API builds upload
    # URLs for local storage from the address the device reached. Without the
    # port, a phone on the Wi-Fi was sent to 192.168.x.x:80, where nothing runs.
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $wow_request_id;
    add_header X-Request-ID $wow_request_id always;
  }
  location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Request-ID $wow_request_id;
    add_header X-Request-ID $wow_request_id always;
  }
}
